<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEARLY DESKTOP</title><link rel="stylesheet" href="style.css?v=1"></head>
<body><header><div><small>DEARLY SERIES</small><h1>DEARLY DESKTOP</h1><p>그 사람의 화면을 들여다보다.</p></div><div><button id="ooc">AI 채팅 OOC 복사</button><button id="save">PNG 저장</button></div></header>
<main><aside>
<h3>DESKTOP</h3><label>테마<select id="theme"><option value="pink">DEARLY PINK</option><option value="modern">DEARLY 11</option><option value="retro">DEARLY 98</option><option value="angel">DEARLY ANGEL</option><option value="dark">DEARLY DARK</option><option value="cyber">DEARLY CYBER</option></select></label>
<label>배경 이미지<input id="wall" type="file" accept="image/*"></label><div id="filename">선택된 파일 없음</div>
<label>배경색<input id="bg" type="color" value="#f6dce8"></label><label>포인트색<input id="accent" type="color" value="#cf769b"></label><label>시간<input id="clock" value="02:17"></label>
<h3>ADD WINDOW</h3><div class="buttons"><button data-add="note">메모장</button><button data-add="message">메신저</button><button data-add="music">뮤직 플레이어</button><button data-add="photo">사진 뷰어</button><button data-add="browser">브라우저</button><button data-add="folder">폴더</button></div>
<h3>DESKTOP ICON</h3><div class="row"><input id="iconName" placeholder="secret"><button id="addIcon">+ 추가</button></div>
<section id="editor"><h3>SELECTED ITEM</h3><p>창이나 아이콘을 선택하면 내용을 수정할 수 있어.</p></section>
</aside>
<section class="stage"><div id="desktop" class="desktop pink"><div id="icons"></div><div id="wins"></div><div class="task"><b>♡</b><span>DEARLY</span><time id="tray">02:17</time></div></div><p>창과 아이콘을 직접 드래그할 수 있어 ♡</p></section></main>
<div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="script.js?v=1"></script></body></html>
