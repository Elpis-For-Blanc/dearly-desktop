<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEARLY DESKTOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Diphylleia&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Jua&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=2"></head>
<body>
<header><div><small>DEARLY SERIES</small><h1>DEARLY DESKTOP</h1><p>그 사람의 화면을 들여다봅니다.</p></div>
<div class="head-actions"><button id="resetBtn">초기화</button><button id="oocBtn">AI 채팅 OOC 복사</button><button class="primary" id="saveBtn">PNG 저장</button></div></header>
<main>
<aside>
<details open><summary>DESKTOP STYLE</summary>
<label>테마<select id="theme">
<option value="pink">DEARLY PINK</option>
<option value="cream">VANILLA CREAM</option>
<option value="angel">ANGEL BLUE</option>
<option value="lavender">LAVENDER</option>
<option value="cherry">CHERRY RED</option>
<option value="mint">MINT GLASS</option>
<option value="mono">MONOCHROME</option>
<option value="newspaper">BLACK & WHITE PAPER</option>
<option value="silver">SILVER DESKTOP</option>
<option value="win98">WINDOWS 98</option>
<option value="winxp">WINDOWS XP</option>
<option value="classicmac">CLASSIC MAC</option>
<option value="terminalgreen">GREEN TERMINAL</option>
<option value="y2k">Y2K SILVER</option>
<option value="office">OFFICE BEIGE</option>
<option value="modern">DEARLY 11</option>
<option value="retro">DEARLY RETRO</option>
<option value="dark">MIDNIGHT</option>
<option value="cyber">CYBER</option>
</select></label>
<label>배경 이미지<input id="wallpaper" type="file" accept="image/*"></label><div id="wallpaperName" class="sub">선택된 파일이 없습니다.</div>
<div class="two"><label>배경색<input id="bgColor" type="color" value="#f5dce8"></label><label>포인트<input id="accent" type="color" value="#c86e94"></label></div>
<label>배경 맞춤<select id="bgFit"><option value="cover">화면 채우기</option><option value="contain">전체 보이기</option><option value="auto">원본 크기</option></select></label>
<label>화면 어둡기 <input id="dim" type="range" min="0" max="55" value="0"></label>
<label>창 투명도 <input id="opacity" type="range" min="70" max="100" value="94"></label>
<label>창 둥글기 <input id="radius" type="range" min="0" max="24" value="12"></label>
<label>전체 폰트<select id="fontFamily">
<option value="'Gowun Dodum', sans-serif">고운돋움</option>
<option value="'Gowun Batang', serif">고운바탕</option>
<option value="'Nanum Myeongjo', serif">나눔명조</option>
<option value="'Diphylleia', serif">산세리프 감성체</option>
<option value="'Jua', sans-serif">주아</option>
<option value="'Black Han Sans', sans-serif">블랙한산스</option>
<option value="'Malgun Gothic', sans-serif">맑은 고딕</option>
<option value="'Courier New', monospace">타자기</option>
</select></label>
<label>전체 글자 크기 <input id="fontSize" type="range" min="10" max="18" value="13"></label>
<label>창 제목 폰트<select id="titleFont">
<option value="'Gowun Dodum', sans-serif">고운돋움</option>
<option value="'Gowun Batang', serif">고운바탕</option>
<option value="'Nanum Myeongjo', serif">나눔명조</option>
<option value="'Jua', sans-serif">주아</option>
<option value="'Black Han Sans', sans-serif">블랙한산스</option>
<option value="'Courier New', monospace">타자기</option>
</select></label>
<div class="two messenger-names">
<label>상대 이름<input id="messageOtherName" value="상대" placeholder="상대 이름"></label>
<label>내 이름<input id="messageMyName" value="나" placeholder="내 이름"></label>
</div><label>표시 시간<input id="clock" value="02:17"></label>
</details>

<details open><summary>ADD WINDOW</summary>
<div class="buttons">
<button data-add="note">메모장</button><button data-add="message">메신저</button><button data-add="music">뮤직 플레이어</button>
<button data-add="photo">사진 뷰어</button><button data-add="browser">브라우저</button><button data-add="folder">폴더</button>
<button data-add="calendar">캘린더</button><button data-add="todo">투두 리스트</button><button data-add="profile">프로필</button>
<button data-add="terminal">터미널</button><button data-add="sticky">스티키 노트</button><button data-add="mail">메일</button>
</div></details>

<details open><div class="taskbar-icon-setting">
<label>아래 DEARLY 아이콘 사진
<input id="brandIconUpload" type="file" accept="image/*">
</label>
<button id="brandIconReset" type="button">기본 아이콘으로</button>
<div class="hint">정사각형 사진을 사용하면 자연스럽게 표시됩니다.</div>
</div>
<summary>DESKTOP ITEM</summary>
<div class="row"><input id="iconName" placeholder="폴더 이름"><button id="addFolder">폴더 +</button></div>
<div class="row"><input id="fileName" placeholder="memo.txt"><button id="addFile">파일 +</button></div>
</details>

<details open><summary>DECORATION</summary>
<div class="buttons"><button data-deco="heart"> 하트</button><button data-deco="star">☆ 별</button><button data-deco="ribbon">리본</button><button data-deco="sparkle">반짝임</button></div>
<p class="sub">장식은 바탕화면에서 직접 이동할 수 있습니다.</p>
</details>

<section id="editor"><h3>SELECTED ITEM</h3><p class="sub">창, 아이콘, 장식을 클릭하면 세부 편집 항목이 표시됩니다.</p></section>
</aside>

<section class="stage"><div id="desktop" class="desktop theme-pink">
<div class="dim"></div><div id="icons"></div><div id="decorations"></div><div id="windows"></div>
<div class="taskbar"><button class="start" id="brandIcon" id="brandIcon"></button><span class="brand">DEARLY</span><span class="taskhint">MY PRIVATE DESKTOP</span><time id="trayClock">02:17</time></div>
</div><p class="help">창 제목 표시줄, 아이콘, 장식을 드래그하여 원하는 위치로 이동할 수 있습니다.</p></section>
</main><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="script.js?v=2"></script>
</body></html>
